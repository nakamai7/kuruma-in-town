// Kuruma in Town is a separate Forge addon; only the Forge 1.20.1 artifact is built.
tasks.register('build') {
    group = 'build'
    description = 'Build Kuruma in Town addon for Forge 1.20.1'
    dependsOn ':forge-1.20.1:build'
}
tasks.register('clean', Delete) {
    group = 'build'
    dependsOn ':forge-1.20.1:clean'
    delete layout.buildDirectory
}
